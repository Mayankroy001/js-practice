<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background-color: black;
}
    .user-card {
        background: #1a1a1a;
        color: #fff;
        width: 300px;
        margin: 60px auto;
        padding: 32px 24px;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .user-avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        margin-bottom: 18px;
        border: 3px solid #444;
    }

    .user-name {
        margin-bottom: 8px;
        font-size: 1.5rem;
        font-weight: 600;
    }

    .user-email {
        margin-bottom: 18px;
        color: #bbb;
        font-size: 1rem;
    }

    .user-btn {
        background: #ff9800;
        color: #fff;
        border: none;
        padding: 10px 28px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
    }
    .user-btn:hover {
        background: #e67c00;
    }
</style>
