<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Download Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Vibrant background to show off the glass effect */
            background: linear-gradient(45deg, #4158D0, #C850C0, #FFCC70);
        }

        /* The Glass Container */
        .glass-card {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            color: white;
        }

        h2 {
            font-weight: 500;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* Progress Bar Container */
        .progress-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animated Progress */
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00DBDE 0%, #FC00FF 100%);
            border-radius: 10px;
            animation: downloadSim 5s ease-in-out infinite;
        }

        .status-text {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

    
    </style>
</head>
<body>

    <div class="glass-card">
        <h2>Downloading...</h2>
        <p>Project_Assets_2026.zip</p>
        
        <div class="progress-container">
            <div class="progress-fill"></div>
        </div>

        <div class="status-text">
            
        </div>
    </div>

</body>
<script src="download.js"></script>
</html>
