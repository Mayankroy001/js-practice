<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    #main {
        width: 100%;
        height: 100%;
        background-color: rgb(34, 32, 32);
        padding: 14px;
    }

    input {
        display: block;
        padding: 10px;
    }

    .card {
        max-width: 400px;
        border: 2px solid white;
        color: wheat;
        display: inline-block;
        border-radius: 10px;
        margin-top: 14px;

    }

    .profile {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        overflow: hidden;
        margin: 14px;
    }

    .profile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .card h1,
    .card h3,
    .card p {
        padding: 14px;
    }

    .card h1 {
        font-size: 24px;
        color: rgba(243, 109, 13, 0.744);
    }
</style>

<body>
    <div id="main">
        <form action="">
            <input type="Profile" placeholder="Profile">
            <input type="Name" placeholder="Name">
            <input type="Occupation" placeholder="Occupation">
            <input type="Info" placeholder="Info">
            <input type="submit">

        </form>

        
        <script src="5.js"></script>
    </div>
</body>

</html>
