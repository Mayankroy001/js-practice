<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        #main {
            width: 100%;
            height: 100%;
            background-color: rgb(70, 68, 68);
            padding: 10px;
        }

        input {
            display: block;
            padding: 14px;
        }

        .card {
            max-width: 400px;
            border: 2px solid white;
            display: inline-block;
            margin-top: 14px;
            border-radius: 10px;
            background-color: rgb(70, 68, 68);
            color: white;
        }

        .card h1,
        .card h3 {
            margin: 14px;
        }

        .card p {
            margin: 14px;
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid white;
            margin: 14px;
            overflow: hidden;
        }

        .profile img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="Profile" placeholder="profile">
            <input type="Name" placeholder="Name">
            <input type="Occupation" placeholder="Occupation">
            <input type="info" placeholder="info">
            <input type="submit">
        </form>


      
    </div>
</body>
<script src="5.js"></script>
</html>
