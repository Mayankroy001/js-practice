<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }

    html, body{
        width: 100%;
        height: 100%;
    }
    #main{
        width: 100%;
        height: 100%;
        background-color: rgb(70, 68, 68);
        position: relative;
        overflow: hidden;
    }

.box{
    width: 300px;
    height: 300px;
    background-color: red;
    position: absolute;
    transition: all   cubic-bezier(0.19, 1, 0.22, 1) 1s;
}
</style>
<body>
    <div id="main">
        <div class="box"></div>
    </div>
</body>
<script src="mousemove.js"></script>
</html>
