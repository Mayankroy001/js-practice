<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        #main {
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            position: relative;
        }

        .box {
            position: absolute;
            transition: all  cubic-bezier(0.19, 1, 0.22, 1) 1s;
            width: 200px;
            height: 200px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div id="main">
        <div class="box"></div>
    </div>
</body>
<script src="7th.js"></script>

</html>
