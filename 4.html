<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
        width: 100%;
    }

    #main {
        height: 100%;
        width: 100%;

        background-color: rgb(57, 54, 54);
    }

    input {
        display: block;
        padding: 30px;
        width: 300px;

    }

    .card {
        margin-top: 40px;
        color: white;
        border-radius: 10px;
        padding: 20px;
        border: 2px solid white;
        width: fit-content;
        height: fit-content;
    }

    .card {
        display: block;
    }

    .profile {
        height: 100px;
        width: 100px;
        border-radius: 50%;
        margin: auto;
        overflow: hidden;
    }

    .profile img {
        height: 100%;
        width: 100%;
        object-fit: cover;
    }

    .card h1,
    .card h3,
    .card p {
        text-align: center;
        margin-top: 14px;
    }

    .card h1 {
        color: rgb(6, 3, 67);
    }
</style>

<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="Name">
            <input type="text" placeholder="Email">
            <input type="text" placeholder="Message">
            <input type="submit">
        </form>

        <div class="card">
            <div class="profile">
                <img src="https://plus.unsplash.com/premium_photo-1683910767532-3a25b821f7ae?q=80&w=808&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt="">
            </div>
            <h1>Mayank Roy</h1>
            <h3>Contact us</h3>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laudantium amet, minus natus provident magni
                dicta, repudiandae totam accusamus saepe nihil unde ea maiores porro asperiores?</p>
        </div>
    </div>

</body>
<script src="4.js"></script>

</html>
