<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    #main {
        width: 100%;
        height: 100%;
        background-color: #181717;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    form {
        display: flex;
        flex-direction: column;
    }

    input,
    select,
    textarea {
        margin: 14px;
        padding: 30px;
        border: 5px solid rgb(38, 183, 53);
        border-radius: 10px;
        font-style: italic;
    }

    small {
        color: red;
        font-size: 12px;
    }
</style>

<body>

    <div id="main">
        <form>
            <input type="name" placeholder="name">
            <br
            <small>your name should be greater than two characters</small>
            <br><br>
            <input type="email" placeholder="email">
            <input type="password" placeholder="password">

            <select>
                <option disabled selected>Choose your Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <textarea placeholder="Write something about you....." id=""></textarea>
            <input type="submit" value="Submit">
        </form>
    </div>

</body>
<script src="froms.js"></script>

</html>
